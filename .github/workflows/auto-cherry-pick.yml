name: steakhal-ci auto-cherry-pick
on:
  schedule: [{ cron: '23 */6 * * *' }]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only, don't push
        type: boolean
        default: false

concurrency:
  group: steakhal-ci-auto-cherry-pick
  cancel-in-progress: false

jobs:
  auto-cherry-pick:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Only the script is needed from this branch. The job fetches the
          # history it needs (and nothing else) for each PR itself.
          fetch-depth: 1
          sparse-checkout: .github/scripts
          # A PAT (contents:write on this fork), so that pushes trigger the
          # pull_request 'synchronize' event on the swiftlang PR. Pushes made
          # with GITHUB_TOKEN do not trigger any workflows.
          token: ${{ secrets.STEAKHAL_CI_PAT }}
      - name: Sync opted-in PRs
        env:
          GH_TOKEN: ${{ secrets.STEAKHAL_CI_PAT }}
          # Scheduled runs always push; manual runs push unless dry_run is ticked.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: |
          git config user.name  "steakhal-ci[bot]"
          git config user.email "steakhal-ci@users.noreply.github.com"
          # Copy first: the script checks out other branches, which would
          # replace the file under the running shell.
          cp .github/scripts/auto-cherry-pick.sh "$RUNNER_TEMP/acp.sh"
          bash "$RUNNER_TEMP/acp.sh"
